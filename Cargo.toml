[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/mxroute-rs"
homepage = "https://github.com/sshine/mxroute-rs"

# Versions live here and the crates inherit them; feature sets stay with the crate that
# needs them, since those are what differ between members.
[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
