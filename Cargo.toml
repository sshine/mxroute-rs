[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/mxroute-rs"
homepage = "https://github.com/sshine/mxroute-rs"

# Versions live here and the crates inherit them; feature sets stay with the crate that
# needs them, since those are what differ between members.
[workspace.dependencies]
# No version requirement: the only consumer is not published, so a path is the whole
# story and a release does not have to bump this too.
mxroute = { path = "crates/mxroute" }

chrono = { version = "0.4.45", default-features = false }
clap = "4.5.51"
reqwest = { version = "0.13.4", default-features = false }
rmcp = "3.2.0"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
