[project]
name = "mxroute-rs"
revision = "1.0"

# Credentials for the live API tests, which are #[ignore]d and only run via `just
# live-test`. Values come from whichever provider the developer configured; nothing
# secret belongs in this file.
[profiles.default]
MXROUTE_SERVER = { description = "Mail server hostname, e.g. eagle.mxlogin.com", required = true }
MXROUTE_USERNAME = { description = "DirectAdmin username", required = true }
MXROUTE_API_KEY = { description = "API key from panel.mxroute.com/api-keys.php", required = true }
MXROUTE_TEST_DOMAIN = { description = "Scratch domain the destructive live tests operate on", required = false }
MXROUTE_TEST_SPAM = { description = "Set to opt into live spam tests, which change settings for every domain on the account", required = false }
MXROUTE_TEST_RESELLER = { description = "Set to opt into live reseller tests, which need a reseller account", required = false }
