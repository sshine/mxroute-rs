[package]
name = "mxroute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MXroute email hosting API client library"
readme = "../../README.md"
keywords = ["mxroute", "email", "directadmin", "hosting"]
categories = ["network-programming", "email"]

[lints]
workspace = true

[features]
default = ["rustls-tls"]
# TLS via rustls. Disable to supply your own reqwest::Client through
# ClientBuilder::http_client, which is also how to get native-tls or a proxy.
rustls-tls = ["reqwest/rustls"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "charset",
  "http2",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = [
  "sync",
  "time",
] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "test-util",
] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wiremock = "0.6.5"
