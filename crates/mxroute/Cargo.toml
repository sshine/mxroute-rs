[package]
name = "mxroute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MXroute email hosting API client library"
readme = "../../README.md"
keywords = ["mxroute", "email", "directadmin", "hosting"]
categories = ["network-programming", "email"]

[lints]
workspace = true

[features]
default = ["rustls-tls"]
# TLS via rustls. Disable to supply your own reqwest::Client through
# ClientBuilder::http_client, which is also how to get native-tls or a proxy.
rustls-tls = ["reqwest/rustls"]

[dependencies]
chrono = { workspace = true, features = ["clock", "serde", "std"] }
reqwest = { workspace = true, features = ["charset", "http2", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "test-util",
] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wiremock = { workspace = true }
