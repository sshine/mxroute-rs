name: Release

on:
  push:
    tags:
      - 'v*'

# A library release ships to crates.io only: there are no binaries to attach, so
# nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Use a single job to keep the Nix store cache warm and the time spent book-keeping minimal.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-17
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/checks
      - run: nix develop -c just check-version "${GITHUB_REF_NAME}"
      - run: nix develop -c cargo publish --locked -p mxroute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
